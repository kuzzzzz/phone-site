<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A quick daily log for mood, energy, and focus.">
  <title>Pulse Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="https://kuzzzzz.github.io/history.html#phone-site" target="_blank" rel="noopener" aria-label="View the development history of this project" class="history-link">↔ View history</a>

  <nav class="site-nav" aria-label="Phone Site navigation">
    <a href="index.html">Daily Boost</a>
    <a href="pulse.html" aria-current="page" class="active">Pulse Check</a>
    <a href="admin.html">Add Boost</a>
  </nav>

  <main class="app-shell">
    <header class="page-header">
      <p class="eyebrow">Pulse Log</p>
      <h1>Quick check-in</h1>
    </header>

    <section class="card pulse-card text-left">
      <h2 class="section-heading">Log this moment</h2>
      <p class="pulse-time" id="time-label"></p>
      <div id="sliders"></div>
      <div class="field-row">
        <label for="note">Note (optional)</label>
        <textarea id="note" placeholder="What are you working on?"></textarea>
      </div>
      <div class="button-row" style="grid-template-columns: 1fr;">
        <button class="primary" id="log-btn" type="button">Log entry</button>
      </div>
      <div class="button-row" style="grid-template-columns: 1fr; margin-top: 8px;">
        <button id="boost-btn" type="button">💾 Save note as Boost</button>
      </div>
      <p class="status" id="saved-msg" role="status" aria-live="polite"></p>
      <p class="status" id="boost-msg" role="status" aria-live="polite"></p>
    </section>

    <section class="card pulse-card text-left">
      <h2 class="section-heading">Patterns by time of day</h2>
      <div id="chart-empty" class="empty-note" style="display:none;">Log a few entries across different times of day to see your pattern here.</div>
      <div id="chart"></div>
    </section>

    <section class="card pulse-card text-left">
      <div class="section-title-row">
        <h2 class="section-heading">Recent entries</h2>
        <span class="export-actions">
          <button class="export-btn" id="import-btn" type="button">⬆ Import CSV</button>
          <button class="export-btn" id="export-btn" type="button">⬇ Export CSV</button>
        </span>
      </div>
      <input type="file" id="import-file" accept=".csv" class="sr-only">
      <p class="status" id="import-msg" role="status" aria-live="polite"></p>
      <div id="history"></div>
    </section>

    <div class="controls card pulse-card text-left" style="margin-top: 0;">
      <label class="toggle-row" for="themeToggle">
        <input id="themeToggle" type="checkbox">
        <span>Dark mode</span>
      </label>
    </div>
  </main>
  <script src="shared.js" defer></script>
  <script src="pulse.js" defer></script>
</body>
</html>
